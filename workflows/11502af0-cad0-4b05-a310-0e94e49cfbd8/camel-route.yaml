# Camel YAML DSL — generated from workflow: GCS_OUTBOUND_TEST
# ID: 11502af0-cad0-4b05-a310-0e94e49cfbd8

  - route:
      id: 11502af0-cad0-4b05-a310-0e94e49cfbd8-processing
      from:
        uri: direct:11502af0-cad0-4b05-a310-0e94e49cfbd8
      steps:
        - doTry:
            steps:
              - setProperty:
                  name: workflowId
                  expression:
                    constant: 11502af0-cad0-4b05-a310-0e94e49cfbd8
              - setProperty:
                  name: workflowName
                  expression:
                    constant: GCS_OUTBOUND_TEST
              - log:
                  message: 'filelist: Listing directory C:/files'
                  logName: com.batchmate.workflow.execution
                  loggingLevel: INFO
              - setProperty:
                  name: _op_dir
                  expression:
                    constant: C:/files
              - setProperty:
                  name: _op_filter
                  expression:
                    constant: '*.txt'
              - setProperty:
                  name: _op_recursive
                  expression:
                    constant: 'false'
              - setProperty:
                  name: _op_var
                  expression:
                    constant: ''
              - bean:
                  ref: fileHelper
                  method: list
              - split:
                  expression:
                    js: body
                  stopOnException: true
                  steps:
                    - log:
                        message: 'fileread: Reading ${body.filePath}'
                        logName: com.batchmate.workflow.execution
                        loggingLevel: INFO
                    - setProperty:
                        name: _fr_dir
                        expression:
                          constant: .
                    - setProperty:
                        name: _fr_file
                        expression:
                          simple: ${body.filePath}
                    - bean:
                        ref: fileHelper
                        method: normalizeReadPath
                    - pollEnrich:
                        expression:
                          simple: file:${exchangeProperty._fr_dir}?fileName=${exchangeProperty._fr_file}&noop=true&idempotent=false
                        timeout: 5000
                    - script:
                        expression:
                          js: var ArrayList=Java.type('java.util.ArrayList');var _ks=new
                            ArrayList(exchange.getMessage().getHeaders().keySet());for(var
                            _i=0;_i<_ks.size();_i++){var _k=String(_ks.get(_i));if(_k.startsWith('Camel')&&_k.length>5){var
                            _nk=_k.charAt(5).toLowerCase()+_k.substring(6);exchange.getMessage().setHeader(_nk,exchange.getMessage().getHeader(_k));exchange.getMessage().removeHeader(_k);}}
                    - log:
                        message: 'gcswrite: Writing gs://batchmatetest/${header.fileName}'
                        logName: com.batchmate.workflow.execution
                        loggingLevel: INFO
                    - toD:
                        uri: google-storage://batchmatetest?serviceAccountKey=file:C:/files/gcp/batchmate-498518-f022a6eabb35.json&objectName=${headers.fileName}
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - setProperty:
                      name: _processingFailed
                      expression:
                        constant: 'true'
                  - setProperty:
                      name: errorMessage
                      expression:
                        simple: ${exception.message}
                  - setProperty:
                      name: errorType
                      expression:
                        simple: ${exception.class.name}
                  - setProperty:
                      name: errorStackTrace
                      expression:
                        simple: ${exception.stacktrace}
                  - setProperty:
                      name: errorCode
                      expression:
                        simple: ${exchangeProperty._errorCode}
                  - to:
                      uri: direct:11502af0-cad0-4b05-a310-0e94e49cfbd8-processingFailed
        - script:
            expression:
              js: if(exchange.getProperties().get('_processingFailed')){var _m=String(exchange.getProperties().get('errorMessage')||'Processing
                failed');throw new java.lang.RuntimeException(_m);}
  - route:
      id: 11502af0-cad0-4b05-a310-0e94e49cfbd8-processingFailed
      from:
        uri: direct:11502af0-cad0-4b05-a310-0e94e49cfbd8-processingFailed
      steps:
        - setProperty:
            name: workflowId
            expression:
              constant: 11502af0-cad0-4b05-a310-0e94e49cfbd8
        - setProperty:
            name: workflowName
            expression:
              constant: GCS_OUTBOUND_TEST
        - setProperty:
            name: _logMsg
            expression:
              js: '''Error Logger: '' + exchange.getProperties().get(''workflowName'')
                + '' - '' + exchange.getProperties().get(''errorMessage'')'
        - log:
            message: ${exchangeProperty._logMsg}
            logName: com.batchmate.workflow.execution
            loggingLevel: INFO
        - setBody:
            expression:
              simple: ${exchangeProperty.errorMessage}
        - setHeader:
            name: subject
            expression:
              simple: ${exchangeProperty.workflowName} Failed
        - setHeader:
            name: to
            expression:
              constant: bhanuprksh96@gmail.com
        - setHeader:
            name: from
            expression:
              constant: bhanuprksh96@gmail.com
        - log:
            message: 'smtp: Sending email to bhanuprksh96@gmail.com'
            logName: com.batchmate.workflow.execution
            loggingLevel: INFO
        - to:
            uri: smtp://smtp.gmail.com:587?to=bhanuprksh96%40gmail.com&username=bhanuprksh96%40gmail.com&password=dnim%20iwdz%20aptv%20uvgw&contentType=text%2Fhtml&mail.smtp.starttls.enable=true
