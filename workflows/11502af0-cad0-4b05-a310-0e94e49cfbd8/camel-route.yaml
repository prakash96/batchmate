# Camel YAML DSL — generated from workflow: GCS_OUTBOUND_TEST
# ID: 11502af0-cad0-4b05-a310-0e94e49cfbd8

  - route:
      id: 11502af0-cad0-4b05-a310-0e94e49cfbd8-processing
      from:
        uri: direct:11502af0-cad0-4b05-a310-0e94e49cfbd8
      steps:
        - setProperty:
            name: workflowId
            expression:
              constant: 11502af0-cad0-4b05-a310-0e94e49cfbd8
        - setProperty:
            name: workflowName
            expression:
              constant: GCS_OUTBOUND_TEST
        - log:
            message: 'filelist: Listing directory C:/files'
            logName: com.batchmate.workflow.execution
            loggingLevel: INFO
        - setProperty:
            name: _op_dir
            expression:
              constant: C:/files
        - setProperty:
            name: _op_filter
            expression:
              constant: '*.txt'
        - setProperty:
            name: _op_recursive
            expression:
              constant: 'false'
        - setProperty:
            name: _op_var
            expression:
              constant: ''
        - bean:
            ref: fileHelper
            method: list
        - split:
            expression:
              js: body
            stopOnException: true
            steps:
              - log:
                  message: 'fileread: Reading ${body.filePath}'
                  logName: com.batchmate.workflow.execution
                  loggingLevel: INFO
              - setProperty:
                  name: _fr_dir
                  expression:
                    constant: .
              - setProperty:
                  name: _fr_file
                  expression:
                    simple: ${body.filePath}
              - bean:
                  ref: fileHelper
                  method: normalizeReadPath
              - pollEnrich:
                  expression:
                    simple: file:${exchangeProperty._fr_dir}?fileName=${exchangeProperty._fr_file}&noop=true&idempotent=false
                  timeout: 5000
              - script:
                  expression:
                    js: var ArrayList=Java.type('java.util.ArrayList');var _ks=new
                      ArrayList(exchange.getMessage().getHeaders().keySet());for(var
                      _i=0;_i<_ks.size();_i++){var _k=String(_ks.get(_i));if(_k.startsWith('Camel')&&_k.length>5){var
                      _nk=_k.charAt(5).toLowerCase()+_k.substring(6);exchange.getMessage().setHeader(_nk,exchange.getMessage().getHeader(_k));exchange.getMessage().removeHeader(_k);}}
              - log:
                  message: 'gcswrite: Writing gs://batchmatetest/${header.fileName}'
                  logName: com.batchmate.workflow.execution
                  loggingLevel: INFO
              - toD:
                  uri: google-storage://batchmatetest?serviceAccountKey=file:C:/files/gcp/batchmate-498518-f022a6eabb35.json&objectName=${headers.fileName}
