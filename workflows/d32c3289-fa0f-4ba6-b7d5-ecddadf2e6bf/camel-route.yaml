# Camel YAML DSL — generated from workflow: File to Sftp
# ID: d32c3289-fa0f-4ba6-b7d5-ecddadf2e6bf

  - route:
      id: d32c3289-fa0f-4ba6-b7d5-ecddadf2e6bf-processing
      from:
        uri: direct:d32c3289-fa0f-4ba6-b7d5-ecddadf2e6bf
      steps:
        - doTry:
            steps:
              - setProperty:
                  name: workflowId
                  expression:
                    constant: d32c3289-fa0f-4ba6-b7d5-ecddadf2e6bf
              - setProperty:
                  name: workflowName
                  expression:
                    constant: File to Sftp
              - log:
                  message: 'filelist: Listing directory C:/files'
                  logName: com.batchmate.workflow.execution
                  loggingLevel: INFO
              - setProperty:
                  name: _op_dir
                  expression:
                    constant: C:/files
              - setProperty:
                  name: _op_filter
                  expression:
                    constant: '*.txt'
              - setProperty:
                  name: _op_recursive
                  expression:
                    constant: 'false'
              - setProperty:
                  name: _op_var
                  expression:
                    constant: ''
              - bean:
                  ref: fileHelper
                  method: list
              - split:
                  expression:
                    js: body
                  stopOnException: true
                  steps:
                    - log:
                        message: 'fileread: Reading ${body.filePath}'
                        logName: com.batchmate.workflow.execution
                        loggingLevel: INFO
                    - setProperty:
                        name: _fr_dir
                        expression:
                          constant: .
                    - setProperty:
                        name: _fr_file
                        expression:
                          simple: ${body.filePath}
                    - bean:
                        ref: fileHelper
                        method: normalizeReadPath
                    - pollEnrich:
                        expression:
                          simple: file:${exchangeProperty._fr_dir}?fileName=${exchangeProperty._fr_file}&noop=true&idempotent=false
                        timeout: 5000
                    - script:
                        expression:
                          js: var ArrayList=Java.type('java.util.ArrayList');var _ks=new
                            ArrayList(exchange.getMessage().getHeaders().keySet());for(var
                            _i=0;_i<_ks.size();_i++){var _k=String(_ks.get(_i));if(_k.startsWith('Camel')&&_k.length>5){var
                            _nk=_k.charAt(5).toLowerCase()+_k.substring(6);exchange.getMessage().setHeader(_nk,exchange.getMessage().getHeader(_k));exchange.getMessage().removeHeader(_k);}}
                    - log:
                        message: 'sftpwrite: Connecting to eu-central-1.sftpcloud.io:22'
                        logName: com.batchmate.workflow.execution
                        loggingLevel: INFO
                    - log:
                        message: 'sftpwrite: Writing ${exchangeProperty.testSftpPath}/${header.fileName}'
                        logName: com.batchmate.workflow.execution
                        loggingLevel: INFO
                    - toD:
                        uri: sftp://3654d12d2d2241fa891e2b57924f1c2b:{{conn.conn-1780246967136-0klan.password}}@eu-central-1.sftpcloud.io:22${exchangeProperty.testSftpPath}?fileName=${header.fileName}&autoCreate=true&disconnect=true
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - setProperty:
                      name: errorMessage
                      expression:
                        simple: ${exception.message}
                  - setProperty:
                      name: errorType
                      expression:
                        simple: ${exception.class.name}
                  - setProperty:
                      name: errorStackTrace
                      expression:
                        simple: ${exception.stacktrace}
                  - setProperty:
                      name: errorCode
                      expression:
                        simple: ${exchangeProperty._errorCode}
                  - to:
                      uri: direct:d32c3289-fa0f-4ba6-b7d5-ecddadf2e6bf-processingFailed
  - route:
      id: d32c3289-fa0f-4ba6-b7d5-ecddadf2e6bf-processingFailed
      from:
        uri: direct:d32c3289-fa0f-4ba6-b7d5-ecddadf2e6bf-processingFailed
      steps:
        - setProperty:
            name: workflowId
            expression:
              constant: d32c3289-fa0f-4ba6-b7d5-ecddadf2e6bf
        - setProperty:
            name: workflowName
            expression:
              constant: File to Sftp
        - setProperty:
            name: _logMsg
            expression:
              js: '''Error Logger: '' + exchange.getProperties().get(''workflowName'')
                + '' - '' + exchange.getProperties().get(''errorMessage'')'
        - log:
            message: ${exchangeProperty._logMsg}
            logName: com.batchmate.workflow.execution
            loggingLevel: INFO
