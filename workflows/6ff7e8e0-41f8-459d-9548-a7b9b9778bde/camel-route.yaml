                  timeout: 5000
              - script:
                  expression:
                    js: var _b=exchange.getMessage().getBody();if(_b!==null&&String(_b.getClass().getName()).includes('GenericFile')){var
                      Files=Java.type('java.nio.file.Files');var Paths=Java.type('java.nio.file.Paths');var
                      _gf=_b.getFile();var _path=_gf!=null?String(_gf.getAbsolutePath()):String(_b.getAbsoluteFilePath());exchange.getMessage().setBody(Files.readString(Paths.get(_path)));}
              - script:
                  expression:
                    js: var ArrayList=Java.type('java.util.ArrayList');var _ks=new
                      ArrayList(exchange.getMessage().getHeaders().keySet());for(var
                      _i=0;_i<_ks.size();_i++){var _k=String(_ks.get(_i));if(_k.startsWith('Camel')&&_k.length>5){var
                      _nk=_k.charAt(5).toLowerCase()+_k.substring(6);exchange.getMessage().setHeader(_nk,exchange.getMessage().getHeader(_k));exchange.getMessage().removeHeader(_k);}}
              - log:
                  message: 'filewrite: Writing to C:/files/ftp/${header.fileName}'
                  logName: com.batchmate.workflow.execution
                  loggingLevel: INFO
              - toD:
                  uri: file:C:/files/ftp?fileName=${header.fileName}&autoCreate=true&fileExist=Override
