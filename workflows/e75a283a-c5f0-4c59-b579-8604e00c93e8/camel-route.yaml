  - route:
      id: e75a283a-c5f0-4c59-b579-8604e00c93e8-processing
      from:
        uri: direct:e75a283a-c5f0-4c59-b579-8604e00c93e8
      steps:
        - log:
            message: 'fileread: Reading file C:\files\readme.txt.pgp'
            logName: com.batchmate.workflow.execution
            loggingLevel: INFO
        - script:
            expression:
              js: 'var Files=Java.type(''java.nio.file.Files'');var Paths=Java.type(''java.nio.file.Paths'');if(!Files.exists(Paths.get(''C:/files/readme.txt.pgp''))){throw
                new Error(''File not found: C:/files/readme.txt.pgp'');}'
        - pollEnrich:
            expression:
              constant: file:C:/files?fileName=readme.txt.pgp&noop=true&idempotent=false
            timeout: 5000
        - script:
            expression:
              js: var _b=exchange.getMessage().getBody();if(_b!==null&&String(_b.getClass().getName()).contains('GenericFile')){var
                Files=Java.type('java.nio.file.Files');var Paths=Java.type('java.nio.file.Paths');exchange.getMessage().setBody(Files.readString(Paths.get(String(_b.getAbsoluteFilePath()))));}
        - script:
            expression:
              js: var ArrayList=Java.type('java.util.ArrayList');var _ks=new ArrayList(exchange.getMessage().getHeaders().keySet());for(var
                _i=0;_i<_ks.size();_i++){var _k=String(_ks.get(_i));if(_k.startsWith('Camel')&&_k.length>5){var
                _nk=_k.charAt(5).toLowerCase()+_k.substring(6);exchange.getMessage().setHeader(_nk,exchange.getMessage().getHeader(_k));exchange.getMessage().removeHeader(_k);}}
        - setProperty:
            name: _pgp_config
            expression:
              constant: 
        - bean:
            ref: pgpHelper
            method: decrypt
        - log:
            message: 'filewrite: Writing to c:/files/${header.fileName}.txt'
            logName: com.batchmate.workflow.execution
            loggingLevel: INFO
        - toD:
